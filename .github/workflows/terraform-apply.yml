name: Terraform Apply (main)

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/terraform-apply.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: tf-apply
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - id: gate
        env:
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          if [[ -n "$ROLE" && -n "$REGION" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS_DEPLOY_ROLE_ARN / AWS_REGION not configured — skipping terraform apply."
          fi

  apply:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"

      - run: npm ci
      - run: npm run build

      - name: terraform init
        run: terraform -chdir=terraform init -input=false

      - name: terraform apply
        run: terraform -chdir=terraform apply -input=false -auto-approve

      - name: Capture outputs
        run: terraform -chdir=terraform output -no-color
