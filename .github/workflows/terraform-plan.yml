name: Terraform Plan (PR)

on:
  pull_request:
    paths:
      - "terraform/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: tf-plan-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - id: gate
        env:
          ROLE: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          if [[ -n "$ROLE" && -n "$REGION" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AWS_DEPLOY_ROLE_ARN / AWS_REGION not configured — skipping terraform plan."
          fi

  plan:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - run: npm ci
      - run: npm run build

      - name: terraform init
        run: terraform -chdir=terraform init -input=false

      - name: terraform plan
        id: plan
        run: |
          terraform -chdir=terraform plan -input=false -no-color -out=tfplan
          terraform -chdir=terraform show -no-color tfplan > plan.txt
          head -c 60000 plan.txt > plan.short.txt

      - name: Comment plan
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: terraform-plan
          path: plan.short.txt
