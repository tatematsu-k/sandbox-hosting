name: Cron Healthcheck

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Smoke test deployed instance
        env:
          SANDBOX_API_URL: ${{ secrets.SANDBOX_API_URL }}
          SANDBOX_VIEW_URL: ${{ secrets.SANDBOX_VIEW_URL }}
          SANDBOX_TOKEN: ${{ secrets.SANDBOX_HEALTHCHECK_TOKEN }}
          SANDBOX_USER: github-ci
        run: |
          if [[ -z "$SANDBOX_API_URL" || -z "$SANDBOX_TOKEN" ]]; then
            echo "::notice::SANDBOX_API_URL / SANDBOX_TOKEN not configured — skipping."
            exit 0
          fi
          bash scripts/healthcheck.sh
