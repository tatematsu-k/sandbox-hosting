name: Cron Healthcheck

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test deployed instance
        env:
          SANDBOX_BASE_URL: ${{ secrets.SANDBOX_BASE_URL }}
          SANDBOX_TOKEN: ${{ secrets.SANDBOX_HEALTHCHECK_TOKEN }}
          SANDBOX_USER: github-ci
        run: bash scripts/healthcheck.sh
